name: Weekly ObsAwareData refresh

# Rebuilds ObsAwareData from the archive as of the most recent Friday and proposes the result for
# review: a pull request on the data repository (body: the change summary) and a draft release with
# the revision-history assets. Nothing is published here; see publish.yml.
# Secrets: OBSAWAREDATA_TOKEN (contents and pull requests read/write on the data repository) and
# CENSUS_API_KEY.

on:
  schedule:
    - cron: "0 16 * * 0"  # Sunday 16:00 UTC; CDC's Friday releases are archived by then
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date (YYYY-MM-DD); default: the most recent Friday"
        required: false
      skip_checks:
        description: "Run even if the pre-run checks fail"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  DATA_REPO: DMA-PRIME/ObsAwareData
  OAD_DATA_ROOT: ${{ github.workspace }}/data
  OAD_OUTPUT_ROOT: ${{ github.workspace }}/out
  AS_OF: ${{ inputs.as_of }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space  # the raw files and intermediate outputs need ~20 GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Check out the data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.OBSAWAREDATA_TOKEN }}
          path: out/ObsAwareData
          fetch-depth: 0  # tags: the pre-run checks compare with the latest release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Caches are restored here and saved right after each download (the registries at the end,
      # even after a failure), so a failed run still leaves them for the next one.
      - name: Restore archived CDC files
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: cache/archive
          key: archive-${{ hashFiles('archive/registry.csv') }}
          restore-keys: archive-

      - name: Restore Census inputs
        id: census-cache
        uses: actions/cache/restore@v4
        with:
          path: data/Census Data
          key: census-${{ hashFiles('tools/fetch_census.py') }}

      - name: Restore snapshot registries  # reuses file profiles, so only new files are read
        uses: actions/cache/restore@v4
        with:
          path: out/weekly_runs/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-

      - name: Census inputs
        run: python tools/fetch_census.py --data-root data

      - name: Save Census inputs
        if: steps.census-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/Census Data
          key: census-${{ hashFiles('tools/fetch_census.py') }}

      - name: Raw CDC files from the archive
        run: python archive/materialize.py --out data --cache cache/archive ${AS_OF:+--as-of "$AS_OF"}

      - name: Save archived CDC files
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/archive
          key: archive-${{ hashFiles('archive/registry.csv') }}

      - name: Refresh
        id: refresh
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SKIP: ${{ inputs.skip_checks && '1' || '' }}
        run: |
          set +e
          python publish/weekly_refresh.py --workers 4 ${AS_OF:+--as-of "$AS_OF"} ${SKIP:+--skip-checks} 2>&1 | tee refresh.log
          code=${PIPESTATUS[0]}
          set -e
          echo "tag=$(grep -oP '^release tag: \K\S+' refresh.log | tail -1)" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            cat out/weekly_runs/*/not_run.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Pre-run checks stopped the refresh (see the summary)"
          fi
          exit "$code"

      - name: Open a pull request and a draft release
        env:
          GH_TOKEN: ${{ secrets.OBSAWAREDATA_TOKEN }}
          TAG: ${{ steps.refresh.outputs.tag }}
        # Safe to rerun for the same tag: the branch is regenerated, and an existing pull request or
        # draft release is updated instead of created. GitHub API calls are retried, and each create
        # is checked afterwards, since a create can succeed even when the call reports an error.
        run: |
          retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "attempt $n failed; retrying in $((60 * n)) s"; sleep $((60 * n)); done; return 1; }
          summary="$GITHUB_WORKSPACE/$(ls -td out/weekly_runs/*/change_summary.md | head -1)"
          assets="$OAD_OUTPUT_ROOT/ObsAwareData_release_assets/$TAG"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          cd out/ObsAwareData
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="refresh/$TAG"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Data refresh $TAG"
          retry git push -q --force origin "$branch"

          pr_exists() { gh pr view "$branch" --repo "$DATA_REPO" --json state --jq .state 2>/dev/null | grep -q OPEN; }
          if pr_exists; then
            retry gh pr edit "$branch" --repo "$DATA_REPO" --body-file "$summary"
          else
            for n in 1 2 3 4 5; do
              gh pr create --repo "$DATA_REPO" --base main --head "$branch" --title "Data refresh $TAG" --body-file "$summary" && break
              sleep $((60 * n)); pr_exists && break
            done
            pr_exists || { echo "::error::could not open the pull request"; exit 1; }
          fi

          draft=$(gh release view "$TAG" --repo "$DATA_REPO" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            echo "::error::release $TAG is already published; not changing it"; exit 1
          elif [ "$draft" = "true" ]; then
            retry gh release edit "$TAG" --repo "$DATA_REPO" --target "$branch" --notes-file "$summary"
          else
            gh release create "$TAG" --repo "$DATA_REPO" --draft --target "$branch" --title "$TAG" --notes-file "$summary" \
              || retry gh release view "$TAG" --repo "$DATA_REPO" > /dev/null
          fi
          retry gh release upload "$TAG" --repo "$DATA_REPO" --clobber "$assets"/*
          n=$(gh release view "$TAG" --repo "$DATA_REPO" --json assets --jq '.assets | length')
          echo "draft release $TAG: $n assets (expected $(ls "$assets" | wc -l))"
          [ "$n" -ge "$(ls "$assets" | wc -l)" ]

      - name: Save snapshot registries
        if: always() && hashFiles('out/weekly_runs/registry/*.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: out/weekly_runs/registry
          key: registry-${{ github.run_id }}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs
          path: |
            refresh.log
            out/weekly_runs/logs/
            out/weekly_runs/*/change_summary.*
            out/weekly_runs/*/not_run.md
            out/weekly_runs/*/*.log
          if-no-files-found: ignore
