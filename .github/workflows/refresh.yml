name: Weekly ObsAwareData refresh

# Rebuilds ObsAwareData from the archive as of the most recent Friday, opens a pull request on the
# data repository (body: the change summary) and a draft release with the revision-history assets,
# then merges the pull request and publishes the release (publish.yml). Every check runs before the
# merge: a failed check, or a change to an already-published snapshot under the same build rules,
# stops the run before anything is merged. With publish unticked (manual runs), it stops at the
# pull request and draft release.
# Secrets: OBSAWAREDATA_TOKEN (contents and pull requests read/write on the data repository) and
# CENSUS_API_KEY.

on:
  schedule:
    - cron: "0 16 * * 0"  # Sunday 16:00 UTC; CDC's Friday releases are archived by then
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date (YYYY-MM-DD); default: the most recent Friday"
        required: false
      skip_checks:
        description: "Run even if the pre-run checks fail"
        type: boolean
        default: false
      publish:
        description: "Merge the pull request and publish the release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  DATA_REPO: DMA-PRIME/ObsAwareData
  OAD_DATA_ROOT: ${{ github.workspace }}/data
  OAD_OUTPUT_ROOT: ${{ github.workspace }}/out
  AS_OF: ${{ inputs.as_of }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.refresh.outputs.tag }}
    steps:
      - name: Free disk space  # the raw files and intermediate outputs need ~20 GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5

      - name: Check out the data repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.OBSAWAREDATA_TOKEN }}
          path: out/ObsAwareData
          fetch-depth: 0  # tags: the pre-run checks compare with the latest release

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Caches are restored here and saved right after each download (the registries at the end,
      # even after a failure), so a failed run still leaves them for the next one.
      - name: Restore archived CDC files
        id: archive-cache
        uses: actions/cache/restore@v5
        with:
          path: cache/archive
          key: archive-${{ hashFiles('cdc_archive/registry.csv') }}
          restore-keys: archive-

      - name: Restore Census inputs
        id: census-cache
        uses: actions/cache/restore@v5
        with:
          path: data/Census Data
          key: census-${{ hashFiles('tools/fetch_census.py') }}

      - name: Restore snapshot registries  # reuses file profiles, so only new files are read
        uses: actions/cache/restore@v5
        with:
          path: out/weekly_runs/registry
          key: registry-${{ github.run_id }}
          restore-keys: registry-

      - name: Census inputs
        run: python tools/fetch_census.py --data-root data

      - name: Save Census inputs
        if: steps.census-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: data/Census Data
          key: census-${{ hashFiles('tools/fetch_census.py') }}

      - name: Raw CDC files from the archive
        run: python cdc_archive/materialize.py --out data --cache cache/archive ${AS_OF:+--as-of "$AS_OF"}

      - name: Save archived CDC files
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: cache/archive
          key: archive-${{ hashFiles('cdc_archive/registry.csv') }}

      - name: Refresh
        id: refresh
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SKIP: ${{ inputs.skip_checks && '1' || '' }}
        run: |
          set +e
          python publish/weekly_refresh.py --workers 4 ${AS_OF:+--as-of "$AS_OF"} ${SKIP:+--skip-checks} 2>&1 | tee refresh.log
          code=${PIPESTATUS[0]}
          set -e
          echo "tag=$(grep -oP '^release tag: \K\S+' refresh.log | tail -1)" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            cat out/weekly_runs/*/not_run.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Pre-run checks stopped the refresh (see the summary)"
          fi
          exit "$code"

      - name: Open a pull request and a draft release
        env:
          GH_TOKEN: ${{ secrets.OBSAWAREDATA_TOKEN }}
          TAG: ${{ steps.refresh.outputs.tag }}
        # Safe to rerun for the same tag: the branch is regenerated, and an existing pull request or
        # draft release is updated instead of created. GitHub API calls are retried, and each create
        # is checked afterwards, since a create can succeed even when the call reports an error.
        run: |
          retry() { for n in 1 2 3 4 5; do "$@" && return 0; echo "attempt $n failed; retrying in $((60 * n)) s"; sleep $((60 * n)); done; return 1; }
          summary="$GITHUB_WORKSPACE/$(ls -td out/weekly_runs/*/change_summary.md | head -1)"
          assets="$OAD_OUTPUT_ROOT/ObsAwareData_release_assets/$TAG"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          cd out/ObsAwareData
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          branch="refresh/$TAG"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Data refresh $TAG"
          retry git push -q --force origin "$branch"

          pr_exists() { gh pr view "$branch" --repo "$DATA_REPO" --json state --jq .state 2>/dev/null | grep -q OPEN; }
          if pr_exists; then
            retry gh pr edit "$branch" --repo "$DATA_REPO" --body-file "$summary"
          else
            for n in 1 2 3 4 5; do
              gh pr create --repo "$DATA_REPO" --base main --head "$branch" --title "Data refresh $TAG" --body-file "$summary" && break
              sleep $((60 * n)); pr_exists && break
            done
            pr_exists || { echo "::error::could not open the pull request"; exit 1; }
          fi

          draft=$(gh release view "$TAG" --repo "$DATA_REPO" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            echo "::error::release $TAG is already published; not changing it"; exit 1
          elif [ "$draft" = "true" ]; then
            retry gh release edit "$TAG" --repo "$DATA_REPO" --target "$branch" --notes-file "$summary"
          else
            gh release create "$TAG" --repo "$DATA_REPO" --draft --target "$branch" --title "$TAG" --notes-file "$summary" \
              || retry gh release view "$TAG" --repo "$DATA_REPO" > /dev/null
          fi
          # no assets when no state has a newly published snapshot (e.g. a version change without new data)
          expected=$(ls "$assets" 2>/dev/null | wc -l)
          if [ "$expected" -gt 0 ]; then
            retry gh release upload "$TAG" --repo "$DATA_REPO" --clobber "$assets"/*
          fi
          n=$(gh release view "$TAG" --repo "$DATA_REPO" --json assets --jq '.assets | length')
          echo "draft release $TAG: $n assets (expected $expected)"
          [ "$n" -ge "$expected" ]

      - name: Merge the pull request
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.OBSAWAREDATA_TOKEN }}
          TAG: ${{ steps.refresh.outputs.tag }}
        # GitHub may still be computing whether a new pull request can be merged, so retry.
        run: |
          for n in 1 2 3 4 5; do
            gh pr merge "refresh/$TAG" --repo "$DATA_REPO" --squash --subject "Data refresh $TAG" --body "" && break
            sleep $((30 * n))
          done
          gh pr view "refresh/$TAG" --repo "$DATA_REPO" --json state --jq .state | grep -q MERGED

      - name: Save snapshot registries
        if: always() && hashFiles('out/weekly_runs/registry/*.csv') != ''
        uses: actions/cache/save@v5
        with:
          path: out/weekly_runs/registry
          key: registry-${{ github.run_id }}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refresh-logs
          path: |
            refresh.log
            out/weekly_runs/logs/
            out/weekly_runs/*/change_summary.*
            out/weekly_runs/*/not_run.md
            out/weekly_runs/*/*.log
          if-no-files-found: ignore

  publish:
    needs: refresh
    if: github.event_name == 'schedule' || inputs.publish
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.refresh.outputs.tag }}
    secrets: inherit

  # One issue per run, success or not, so the owner gets an email either way (the @mention ensures
  # it). Closed on success; a failure stays open until handled.
  notify:
    needs: [refresh, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read  # to name the failed steps
    steps:
      - name: Report the result in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.refresh.outputs.tag }}
          REFRESH: ${{ needs.refresh.result }}
          PUBLISH: ${{ needs.publish.result }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # publish is skipped only after a failed refresh or on a manual run with publish unticked
          if [ "$REFRESH" = success ] && [ "$PUBLISH" != failure ] && [ "$PUBLISH" != cancelled ]; then
            ok=1; status=succeeded
          else
            ok=; status=failed
          fi
          title="Refresh $(date -u +%Y-%m-%d) $status${TAG:+: $TAG}"
          [ "$EVENT" = schedule ] && kind=scheduled || kind=manual
          {
            echo "@$OWNER the $kind refresh $status."
            echo
            echo "- Refresh: $REFRESH; publish: $PUBLISH"
            echo "- Release tag: ${TAG:-none}"
            if [ -n "$TAG" ]; then
              echo "- Data repository: https://github.com/$DATA_REPO/pulls?q=is%3Apr+%22${TAG//+/%2B}%22, release https://github.com/$DATA_REPO/releases/tag/${TAG//+/%2B}"
            fi
            echo "- Run and logs: $RUN_URL"
            if [ -z "$ok" ]; then
              echo
              echo "Failed steps:"
              gh run view "$GITHUB_RUN_ID" --json jobs \
                --jq '.jobs[] | . as $j | .steps[] | select(.conclusion == "failure") | "- \($j.name): \(.name)"' \
                || echo "- (could not list them; see the run)"
            fi
          } > body.md
          cat body.md

          # A create can succeed even when the call reports an error, so check before retrying.
          url=
          for n in 1 2 3; do
            url=$(gh issue create --title "$title" --body-file body.md) && break
            sleep $((30 * n))
            url=$(gh issue list --state all --search "in:title \"$title\"" --json url --jq '.[0].url // empty' || true)
            [ -n "$url" ] && break
          done
          [ -n "$url" ] || { echo "::error::could not open the issue"; exit 1; }
          echo "$url"
          if [ -n "$ok" ]; then gh issue close "$url" --reason completed; fi
