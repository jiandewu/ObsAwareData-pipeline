name: Check secrets

# Run by hand to confirm the refresh workflow's secrets work. Changes nothing: write access is
# tested with a dry-run push and with create requests that are rejected for a missing field
# (422 = allowed, 403 = not allowed).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_REPO: DMA-PRIME/ObsAwareData

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: OBSAWAREDATA_TOKEN
        env:
          GH_TOKEN: ${{ secrets.OBSAWAREDATA_TOKEN }}
        run: |
          set +e  # report every check instead of stopping at the first non-zero exit
          fail=0
          check() {  # name, expected HTTP status, gh api args...
            name=$1; want=$2; shift 2
            resp=$(gh api "$@" -i 2>/dev/null)
            got=$(echo "$resp" | head -1 | awk '{print $2}')
            msg=$(echo "$resp" | grep -o '"message":"[^"]*"' | head -1)
            if [ "$got" = "$want" ]; then echo "OK   $name (HTTP $got)"; else echo "FAIL $name (HTTP ${got:-none}, expected $want) $msg"; fail=1; fi
          }
          check "read the repository" 200 "repos/$DATA_REPO"
          check "read releases" 200 "repos/$DATA_REPO/releases?per_page=1"
          check "create pull requests (rejected request)" 422 -X POST "repos/$DATA_REPO/pulls" -f title=x
          check "create releases (rejected request)" 422 -X POST "repos/$DATA_REPO/releases" -f name=x
          if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/$DATA_REPO.git" HEAD > /dev/null 2>&1; then
            echo "OK   git read"; else echo "FAIL git read"; fail=1; fi
          git init -q t && cd t && git -c user.name=check -c user.email=check@example.invalid commit -q --allow-empty -m test
          if out=$(git push --dry-run "https://x-access-token:${GH_TOKEN}@github.com/$DATA_REPO.git" HEAD:refs/heads/secret-check 2>&1); then
            echo "OK   git push (dry run)"; else echo "FAIL git push (dry run): $(echo "$out" | tail -3 | tr '\n' ' ')"; fail=1; fi
          exit $fail

      - name: CENSUS_API_KEY
        if: always()
        env:
          KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          body=$(curl -s -w '\n%{http_code}' "https://api.census.gov/data/2022/acs/acs5?get=NAME&for=state:45&key=$KEY")
          code=$(echo "$body" | tail -1)
          if [ "$code" = "200" ] && echo "$body" | grep -q "South Carolina"; then echo "OK   Census API (HTTP 200)"
          else echo "FAIL Census API (HTTP $code): $(echo "$body" | head -2 | cut -c1-200)"; exit 1; fi
